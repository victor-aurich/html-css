<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: "starwars";
            src: url("Starjout.ttf") format("truetype");
            font-weight: bold;
            font-style: normal;

            /*
            Tipos de format ()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype (eot)
            - truetype-aat (apple advanced typography)
            - svg
            - woff / woff2 (os mais usados hoje)
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: "starwars", Arial, sans-serif;
            font-size: 3em;
            ;
        }
    </style>
</head>
<body>
    <h1>StarWars</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dicta dolore placeat sequi quas, molestiae reprehenderit temporibus facere nihil perspiciatis assumenda voluptatum laudantium enim! Voluptate totam pariatur, ducimus rem numquam illo.</p>
    
</body>
</html>
