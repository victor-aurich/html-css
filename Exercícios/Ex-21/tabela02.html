<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas grandes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        thead > tr >th {
            position: sticky;
            top: -1px;
            background-color: gray;

        }

        thead, tfoot {
            background-color: gray;
            text-align: center;
        }

        tbody > tr:nth-child(odd) {
            background-color: rgb(227, 224, 224);
           
        }

        td.num {
            text-align: right;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            background-color: azure;
        }

    
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!-- 
    ANATOMIA PARA TABELAS GRANDES 
    TABLE 
        CAPTION
        THEAD
            TR, TD, TH
        TBODY
            TR, TD, TH
        TFOOT
            TR, TD TH
            -->
    <table>
        <caption>População dos estados</caption>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 049</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">50 896 458</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">898 325</td>
            </tr>
            <tr>
                <td>Santa Catarina</td>
                <td class="num">6546464464</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="num">895 026</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="num">326 025</td>
            </tr>
                <td>Mato Grosso do Sul</td>
                <td class="num">8962</td>
            <tr> class="num"
                <td>Alagoas</td>
                <td class="num">4684641654</td>
            </tr>
            <tr>
                <td>Manaus</td>
                <td class="num">148646846</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td class="num"><strong>210.147.125</strong></td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
