<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pages em iframe</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        iframe {
            width: 90%;
            border: 2px solid black;
            border-radius: 20px;
            height: 400px;
        }

    </style>
</head>
<body>
    <h1>Páginas internas dentro de um iframe</h1>
    <p>Selecione o conteúdo que aparecerá no iframe</p>
    <ul>
        <li><a href="page01.html" target="frame">Primeira Pagina</a></li>
        <li><a href="page002.html" target="frame">Segunda página</a></li>
        <li><a href="page03.html" target="frame">Terceira Página</a></li>
    </ul>

    <iframe name="frame" src="page01.html" frameborder="0"></iframe>
    
</body>
</html>
